# Trestle graph endpoint as a supervised orb service (`amp orb services
# ensure`): graph explorer at /, MCP endpoint at /mcp.
services:
  trestle:
    command: node bin/trestle.js serve --host 0.0.0.0 --port "$PORT"
    health: /health
    portal:
      title: Knowledge Graph
      description: Explore the live Trestle knowledge graph; MCP at /mcp.
