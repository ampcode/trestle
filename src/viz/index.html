<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Trestle Graph</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script defer src="/assets/cosmos.js"></script>
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
          <div>
            <p class="eyebrow">Trestle</p>
            <h1 id="title">Knowledge graph</h1>
          </div>
        </div>
        <div class="search-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
          <input id="search" type="search" placeholder="Search nodes…" autocomplete="off" aria-label="Search nodes" />
          <kbd>/</kbd>
        </div>
        <div class="top-actions">
          <span id="revision" class="revision">revision —</span>
          <button id="fit" class="icon-button" type="button" title="Fit graph" aria-label="Fit graph">
            <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5" /></svg>
          </button>
          <button id="refresh" class="primary-button" type="button">
            <svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 8.5A7 7 0 0 1 18.8 7M5.2 17A7 7 0 0 0 17.9 15.5" /></svg>
            Refresh
          </button>
        </div>
      </header>

      <aside class="sidebar" aria-label="Graph controls">
        <section class="metrics" aria-label="Graph summary">
          <div><strong id="node-count">0</strong><span>nodes</span></div>
          <div><strong id="edge-count">0</strong><span>edges</span></div>
          <div><strong id="fact-count">0</strong><span>facts</span></div>
        </section>
        <div class="rule"></div>
        <section>
          <div class="section-heading"><h2>Node kinds</h2><button id="nodes-all" type="button">All</button></div>
          <div id="node-kinds" class="filter-list"></div>
        </section>
        <section>
          <div class="section-heading"><h2>Relationships</h2><button id="edges-all" type="button">All</button></div>
          <div id="edge-kinds" class="filter-list"></div>
        </section>
        <footer>
          <span class="status-dot"></span>
          <span>Live SQLite graph</span>
        </footer>
      </aside>

      <main class="stage">
        <div id="graph" aria-label="Interactive knowledge graph"></div>
        <div id="empty" class="empty-state" hidden>
          <div class="empty-glyph" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="eyebrow">Waiting for evidence</p>
          <h2 id="empty-title">Initialize the graph</h2>
          <p id="empty-copy">Build the profile, then extract and resolve the repository.</p>
          <code id="empty-command">trestle profile build</code>
        </div>
        <div id="tooltip" class="tooltip" hidden></div>
      </main>

      <aside id="inspector" class="inspector" aria-label="Selection details" hidden>
        <button id="close-inspector" class="close-button" type="button" aria-label="Close details">×</button>
        <p id="detail-kind" class="eyebrow"></p>
        <h2 id="detail-title"></h2>
        <div id="detail-body"></div>
      </aside>
    </div>
  </body>
</html>
